{% extends "base.html" %}
{% block title %}运行 — ComfyUI 工作流运行器{% endblock %}

{% block content %}
{#- workflows + preset_cfgs JSON 通过 script 标签注入, 避免 tojson 双引号冲突 x-data 属性 -#}
<script>
  window.__WORKFLOWS__ = {{ workflows | tojson }};
  window.__PRESET_CFGS__ = {{ preset_cfgs | tojson }};
</script>
<div class="workflow-workbench" x-data="runTab(window.__WORKFLOWS__, window.__PRESET_CFGS__)" x-init="init()">

  <!-- 左侧导航栏 -->
  <aside class="workflow-nav-rail">
    <div class="nav-group">
      <p class="nav-section-title">导航</p>
      <input type="text" class="nav-search"
             placeholder="🔍 按名称筛选…"
             x-model="searchQuery"
             autocomplete="off">
      <ul class="workflow-list">
        <template x-for="w in filteredWorkflows" :key="w.name">
          <li>
            <label :class="{ selected: w.name === currentPreset }"
                   @click="selectPreset(w.name)">
              <input type="radio" name="preset"
                     :value="w.name"
                     x-model="currentPreset">
              <span class="wf-icon" x-text="w.icon"></span>
              <span class="wf-text" x-text="w.display_name"></span>
            </label>
          </li>
        </template>
      </ul>
    </div>

    <!-- 系统状态块已搬到 base.html 的 system-bar (在 main-tabs 下), 不再在 nav-rail 里 -->
  </aside>

  <!-- 右侧工作区 (动态切换 preset) -->
  <section class="workflow-main-stage">
    <template x-for="w in workflows" :key="w.name">
      <div class="preset-panel" x-show="w.name === currentPreset"
           x-data="{ presetCfg: getPresetCfg(w.name), formValues: {}, defaultResultHtml: '' }"
           x-init="initPanelScope(w.name, $data)"
           :data-preset="w.name">

        <!-- Creator-style 卡片头 (linktree 风格, 复用森系主题) -->
        <header class="creator-card" data-creator-card>
          <div class="creator-meta">
            <h2 class="creator-title" x-text="w.display_name"></h2>
            <p class="creator-handle" x-text="'@' + (w.name || 'workflow')"></p>
            <p class="creator-bio" x-text="w.description || '让 WebUI 代你调用 ComfyUI 工作流'"></p>
          </div>
          <div class="creator-socials" aria-label="快捷动作">
            <button class="btn-secondary creator-stagger" type="button" @click="loadExample(w.name)">📥 加载示例</button>
            <button class="btn-secondary creator-stagger" type="button" @click="loadLastRun(w.name)" x-show="hasLastRun[w.name]">📂 加载上次</button>
            <a class="btn-secondary creator-stagger" href="/comfy_input" target="_blank" rel="noopener">👁️ 输入目录</a>
            <a class="btn-secondary creator-stagger" href="/comfy_output?filename=Anima_Turbo_smoke_00001_.png&type=output&subfolder=" target="_blank" rel="noopener">📖 最近输出</a>
          </div>
        </header>

        <!-- 两栏布局: 左控制 / 右结果 -->
        <!-- 注: 加载示例 / 加载上次参数 已合并到 creator-card 顶部, 避免重复按钮 -->
        <div class="preset-body">
          <!-- ===== 左栏: 表单 + 运行控制 ===== -->
          <div class="preset-controls">
            <!-- 表单 (加载 preset cfg 后渲染 spec 字段) -->
            <div class="preset-form">
              <template x-if="presetCfg === null">
                <p class="loading-placeholder">加载中…</p>
              </template>
              <template x-if="presetCfg !== null">
                <div>
                  <!-- 基础设置: tier=basic 的字段, 默认展开 -->
                  <template x-for="{ spec, idx } in basicInputs(presetCfg)" :key="'b' + idx">
                    <div class="form-field" data-tier="basic">
                      <label class="field-label" x-text="spec.label"></label>
                      <template x-if="spec.type === 'file:image'">
                        <div class="file-field">
                          <div class="file-status" x-show="formValues[idx]">
                            <span class="file-status-dot"></span>
                            <span class="file-status-name" x-text="formValues[idx]"></span>
                            <button type="button" class="file-status-clear" @click="clearFile(w.name, idx)" title="清除选中, run 时不传这个位置">× 清除</button>
                          </div>
                          <label class="file-upload">
                            <input type="file" :accept="imageExts"
                                   @change="onFileSelect($event, w.name, idx, 'image')">
                            <span x-show="formValues[idx]">👇 点击上传新文件覆盖</span>
                            <span x-show="!formValues[idx]">📁 选择图片 (示例已加载, 可上传覆盖)</span>
                          </label>
                          <img class="file-thumb" x-show="formValues[idx] && getExampleThumbUrl(w.name, idx)"
                               :src="getExampleThumbUrl(w.name, idx)" loading="lazy">
                        </div>
                      </template>
                      <template x-if="spec.type === 'file:video'">
                        <div class="file-field">
                          <div class="file-status" x-show="formValues[idx]">
                            <span class="file-status-dot"></span>
                            <span class="file-status-name" x-text="formValues[idx]"></span>
                            <button type="button" class="file-status-clear" @click="clearFile(w.name, idx)" title="清除选中, run 时不传这个位置">× 清除</button>
                          </div>
                          <label class="file-upload">
                            <input type="file" :accept="videoExts"
                                   @change="onFileSelect($event, w.name, idx, 'video')">
                            <span x-show="formValues[idx]">👇 点击上传新视频覆盖</span>
                            <span x-show="!formValues[idx]">📁 选择视频 (示例已加载, 可上传覆盖)</span>
                          </label>
                          <video class="file-thumb" x-show="formValues[idx] && getExampleThumbUrl(w.name, idx)"
                                 :src="getExampleThumbUrl(w.name, idx)" controls preload="metadata"></video>
                        </div>
                      </template>
                      <template x-if="['text', 'prompt_pool'].includes(spec.type)">
                        <div>
                          <textarea x-model="formValues[idx]" :placeholder="spec.help || ''" rows="4"></textarea>
                          <template x-if="spec.type === 'prompt_pool'">
                            <div class="prompt-actions">
                              <button type="button" class="btn-secondary" @click="randomPrompt(w.name, idx, 1)">🎲 随机提示词</button>
                            </div>
                          </template>
                        </div>
                      </template>
                      <template x-if="spec.type === 'image_sizes'">
                        <fieldset class="sizes-fieldset">
                          <template x-for="opt in (spec.presets || ['1024x1024'])" :key="opt">
                            <label class="size-option" :class="{ selected: (formValues[idx] || []).includes(sizeValue(opt)) }">
                              <input type="checkbox" :value="sizeValue(opt)" :checked="(formValues[idx] || []).includes(sizeValue(opt))" @change="onSizeToggle($event, w.name, idx)">
                              <span x-text="sizeLabel(opt)"></span>
                            </label>
                          </template>
                        </fieldset>
                      </template>
                      <template x-if="spec.type === 'bool'">
                        <label class="bool-field">
                          <input type="checkbox" x-model="formValues[idx]">
                          <span x-text="spec.help || ''"></span>
                        </label>
                      </template>
                      <template x-if="spec.type === 'select'">
                        <select x-model="formValues[idx]">
                          <template x-for="c in (spec.choices || [])" :key="typeof c === 'object' ? c.value : c">
                            <option :value="typeof c === 'object' ? c.value : c"
                                    x-text="typeof c === 'object' ? c.label : c"></option>
                          </template>
                        </select>
                      </template>
                      <template x-if="spec.type === 'int_random'">
                        <div class="int-random-field">
                          <label><input type="checkbox" x-model="formValues[idx + '_random']"> 随机</label>
                          <input type="number" x-model="formValues[idx]"
                                 :disabled="formValues[idx + '_random']" :min="spec.min || 0">
                        </div>
                      </template>
                      <template x-if="spec.type === 'int'">
                        <input type="number" x-model="formValues[idx]"
                               :min="spec.min" :max="spec.max" :step="spec.step || 1">
                      </template>
                      <p class="field-help" x-show="spec.help" x-text="spec.help"></p>
                    </div>
                  </template>

                  <!-- 高级设置: tier=advanced 的字段, 默认折叠进 details -->
                  <details class="advanced-section" x-show="advancedInputs(presetCfg).length > 0">
                    <summary>🔧 高级设置 <span class="advanced-count" x-text="'(' + advancedInputs(presetCfg).length + ')'"></span></summary>
                    <template x-for="{ spec, idx } in advancedInputs(presetCfg)" :key="'a' + idx">
                      <div class="form-field" data-tier="advanced">
                        <label class="field-label" x-text="spec.label"></label>
                        <template x-if="spec.type === 'file:image'">
                          <div class="file-field">
                            <div class="file-status" x-show="formValues[idx]">
                              <span class="file-status-dot"></span>
                              <span class="file-status-name" x-text="formValues[idx]"></span>
                              <button type="button" class="file-status-clear" @click="clearFile(w.name, idx)" title="清除选中, run 时不传这个位置">× 清除</button>
                            </div>
                            <label class="file-upload">
                              <input type="file" :accept="imageExts"
                                     @change="onFileSelect($event, w.name, idx, 'image')">
                              <span x-show="formValues[idx]">👇 点击上传新文件覆盖</span>
                              <span x-show="!formValues[idx]">📁 选择图片 (示例已加载, 可上传覆盖)</span>
                            </label>
                            <img class="file-thumb" x-show="formValues[idx] && getExampleThumbUrl(w.name, idx)"
                                 :src="getExampleThumbUrl(w.name, idx)" loading="lazy">
                          </div>
                        </template>
                        <template x-if="spec.type === 'file:video'">
                          <div class="file-field">
                            <div class="file-status" x-show="formValues[idx]">
                              <span class="file-status-dot"></span>
                              <span class="file-status-name" x-text="formValues[idx]"></span>
                              <button type="button" class="file-status-clear" @click="clearFile(w.name, idx)" title="清除选中, run 时不传这个位置">× 清除</button>
                            </div>
                            <label class="file-upload">
                              <input type="file" :accept="videoExts"
                                     @change="onFileSelect($event, w.name, idx, 'video')">
                              <span x-show="formValues[idx]">👇 点击上传新视频覆盖</span>
                              <span x-show="!formValues[idx]">📁 选择视频 (示例已加载, 可上传覆盖)</span>
                            </label>
                            <video class="file-thumb" x-show="formValues[idx] && getExampleThumbUrl(w.name, idx)"
                                   :src="getExampleThumbUrl(w.name, idx)" controls preload="metadata"></video>
                          </div>
                        </template>
                        <template x-if="['text', 'prompt_pool'].includes(spec.type)">
                          <div>
                            <textarea x-model="formValues[idx]" :placeholder="spec.help || ''" rows="4"></textarea>
                            <template x-if="spec.type === 'prompt_pool'">
                              <div class="prompt-actions">
                                <button type="button" class="btn-secondary" @click="randomPrompt(w.name, idx, 1)">🎲 随机提示词</button>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="spec.type === 'image_sizes'">
                          <fieldset class="sizes-fieldset">
                            <template x-for="opt in (spec.presets || ['1024x1024'])" :key="opt">
                              <label class="size-option">
                                <input type="checkbox" :value="sizeValue(opt)" @change="onSizeToggle($event, w.name, idx)">
                                <span x-text="sizeLabel(opt)"></span>
                              </label>
                            </template>
                          </fieldset>
                        </template>
                        <template x-if="spec.type === 'bool'">
                          <label class="bool-field">
                            <input type="checkbox" x-model="formValues[idx]">
                            <span x-text="spec.help || ''"></span>
                          </label>
                        </template>
                        <template x-if="spec.type === 'select'">
                          <select x-model="formValues[idx]">
                            <template x-for="c in (spec.choices || [])" :key="typeof c === 'object' ? c.value : c">
                              <option :value="typeof c === 'object' ? c.value : c"
                                      x-text="typeof c === 'object' ? c.label : c"></option>
                            </template>
                          </select>
                        </template>
                        <template x-if="spec.type === 'int_random'">
                          <div class="int-random-field">
                            <label><input type="checkbox" x-model="formValues[idx + '_random']"> 随机</label>
                            <input type="number" x-model="formValues[idx]"
                                   :disabled="formValues[idx + '_random']" :min="spec.min || 0">
                          </div>
                        </template>
                        <template x-if="spec.type === 'int'">
                          <input type="number" x-model="formValues[idx]"
                                 :min="spec.min" :max="spec.max" :step="spec.step || 1">
                        </template>
                        <p class="field-help" x-show="spec.help" x-text="spec.help"></p>
                      </div>
                    </template>
                  </details>
                </div>
              </template>
            </div>

            <!-- 运行按钮 -->
            <div class="run-controls">
              <button class="btn-run-primary"
                      type="button"
                      @click="runWorkflow(w.name)"
                      :disabled="isRunning(w.name)">
                🚀 开始运行
              </button>
            </div>
          </div>

          <!-- ===== 右栏: 结果展示 (状态条 + 日志 + 错误 + 结果) ===== -->
          <div class="preset-result">
            <div class="run-status-bar" :class="'status-' + (runState[w.name] || 'idle')"
                 x-show="runState[w.name] && runState[w.name] !== 'idle'">
              <span class="status-icon" x-html="statusIcon(w.name)"></span>
              <span class="status-label" x-text="statusLabel(w.name)"></span>
              <span class="status-msg" x-text="statusMsg[w.name]"></span>
              <span class="status-elapsed" x-text="elapsedStr[w.name]"></span>
            </div>

            <!-- 运行日志 (折叠) -->
            <details class="run-log" x-show="runLogs[w.name]">
              <summary>📜 运行日志</summary>
              <pre x-text="runLogs[w.name]"></pre>
            </details>

            <!-- 错误条 -->
            <div class="error-banner" x-show="errorHtml[w.name]"
                 x-html="errorHtml[w.name]"></div>

            <!-- 结果区 -->
            <div class="result-area">
              <p class="result-placeholder" x-show="!resultHtml[w.name] && !defaultResultHtml">等待结果…</p>
              <div x-show="defaultResultHtml && !resultHtml[w.name]" x-html="defaultResultHtml"></div>
              <div x-show="resultHtml[w.name]" x-html="resultHtml[w.name]"></div>
            </div>

            <!-- 再来一次 / 打开输出目录 -->
            <div class="result-actions" x-show="runState[w.name] === 'success'">
              <button type="button" class="btn-run-secondary"
                      @click="runWorkflow(w.name)">🔁 用相同参数再运行</button>
              <button type="button" class="btn-secondary"
            </div>
          </div>
        </div>
      </div>
    </template>
  </section>
</div>
{% endblock %}
