{% extends "base.html" %}
{% block title %}系统设置 — ComfyUI 工作流运行器{% endblock %}

{% block content %}
<div class="settings-page" x-data="settingsTab()">

  <section class="settings-section">
    <h2>⚙️ 系统设置</h2>
    <p>ComfyUI 地址运行时可改。默认 <code>{{ default_url }}</code>。</p>

    <div class="url-row">
      <input type="text"
             x-model="url"
             placeholder="http://127.0.0.1:8188"
             autocomplete="off"
             class="url-input">
      <button type="button" class="btn-run-primary"
              @click="saveUrl()">保存并测试</button>
    </div>

    <div class="url-actions">
      <button type="button" class="btn-secondary" @click="resetUrl()">恢复默认</button>
      <button type="button" class="btn-secondary" @click="retestUrl()">重新测试</button>
      <button type="button" class="btn-secondary" @click="fullCheck()">🔍 完整健康检查</button>
    </div>

    <p class="status-text" x-show="statusMsg" x-text="statusMsg"></p>
  </section>

  <hr>

  <section class="settings-section">
    <h2>🎨 主题</h2>
    <p>切换后即时生效。新增编辑 <code>app/presets/themes.json</code>。</p>

    <fieldset class="theme-options">
      <template x-for="t in themes" :key="t.id">
        <label :class="{ selected: t.id === currentThemeId }">
          <input type="radio" name="theme" :value="t.id" x-model="currentThemeId"
                 @change="changeTheme(t.id)">
          <span class="theme-name" x-text="t.name"></span>
          <span class="theme-swatches">
            <span class="theme-swatch" :style="'background:' + (t.tokens['--bg-app'] || '#222')"></span>
            <span class="theme-swatch" :style="'background:' + (t.tokens['--theme-accent-400'] || '#888')"></span>
            <span class="theme-swatch" :style="'background:' + (t.tokens['--text-primary'] || '#fff')"></span>
          </span>
        </label>
      </template>
    </fieldset>
  </section>

  <!-- 完整健康检查报告: 点击后才弹出 modal, 不占起始页面高度 -->
  <dialog class="health-modal" @close="healthReport=''" @click="if ($event.target === $event.currentTarget) $event.target.close()">
    <button type="button" class="health-modal-close" @click="$el.closest('dialog').close()" aria-label="关闭报告 (Esc)">×</button>
    <h3>🔍 完整健康检查报告</h3>
    <div class="health-report" x-html="healthReport"></div>
  </dialog>
</div>
{% endblock %}
