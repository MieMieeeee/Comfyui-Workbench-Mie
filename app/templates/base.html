<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Web Interface Guidelines: theme-color + color-scheme 让浏览器原生控件走暗 variant -->
  <meta name="theme-color" content="{{ page_bg_color }}">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}ComfyUI 工作流运行器{% endblock %}</title>

  <!-- 主题 CSS: tokens.css (:root 变量 + 共享组件) + app-flask.css (Flask 布局) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app-flask.css') }}">
  <style id="theme-injector">{{ theme_css_content | safe }}</style>

  <!-- app.js 必须先加载, 再加载 Alpine (Alpine 启动时需要 appShell/runTab/settingsTab 已定义) -->
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='alpine.min.js') }}"></script>
</head>
<body data-theme="{{ theme_id }}" x-data="appShell()" x-init="init()" :class="{ 'theme-pending': pending }">
  <!-- 应用头部 -->
  <header class="app-shell-header">
    <h1>🎬 ComfyUI 工作流运行器</h1>
  </header>

  <!-- 主导航 tabs -->
  <nav class="main-tabs">
    <a href="{{ url_for('index') }}"
       :class="{ active: currentTab === 'run' }">▶ 运行</a>
    <a href="{{ url_for('wizard_page') }}"
       :class="{ active: currentTab === 'wizard' }">🪄 添加工作流</a>
    <a href="{{ url_for('settings_page') }}"
       :class="{ active: currentTab === 'settings' }">⚙️ 系统设置</a>
  </nav>

  <!-- 系统状态横栏: 在 main-tabs 下, 跟主区同样 1200px 上限, 用户一眼看 ComfyUI 状态 -->
  <div class="system-bar">
    <button class="btn-secondary" type="button" @click="refreshStatus()" title="刷新状态">🔄 刷新状态</button>
    <span class="system-status" x-html="systemStatusHtml"></span>
    <button class="btn-secondary" type="button" @click="openOutputFolder()" title="打开 ComfyUI 输出目录">📂 输出目录</button>
    <span class="system-open-msg" x-show="openDirMsg" x-text="openDirMsg"></span>
  </div>

  <!-- 主内容区 (子模板填充) -->
  <main class="main-stage">
    <div class="page-frame">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
