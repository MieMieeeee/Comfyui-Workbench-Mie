<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Web Interface Guidelines: theme-color + color-scheme 让浏览器原生控件走暗 variant -->
  <meta name="theme-color" content="{{ page_bg_color }}">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}ComfyUI 工作流运行器{% endblock %}</title>

  <!-- 主题 CSS: tokens.css (:root 变量 + 共享组件) + app-flask.css (Flask 布局) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app-flask.css') }}">
  <style id="theme-injector">{{ theme_css_content | safe }}</style>

  <!-- app.js 必须先加载, 再加载 Alpine (Alpine 启动时需要 appShell/runTab/settingsTab 已定义) -->
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='alpine.min.js') }}"></script>
</head>
<body data-theme="{{ theme_id }}" x-data="appShell()" x-init="init()" :class="{ 'theme-pending': pending }">
  <!-- 应用头部 -->
  <header class="app-shell-header">
    <h1>🎬 ComfyUI 工作流运行器</h1>
  </header>

  <!-- 主导航 + 系统状态合并: nav 居中 (子 flex group), 状态 pill 靠右. -->
  <nav class="main-tabs">
    <div class="main-tabs-nav">
      <a href="{{ url_for('index') }}"
         :class="{ active: currentTab === 'run' }">🎬 工作流</a>
      <a href="{{ url_for('wizard_page') }}"
         :class="{ active: currentTab === 'wizard' }">🪄 自定义工作流</a>
      <a href="{{ url_for('settings_page') }}"
         :class="{ active: currentTab === 'settings' }">⚙️ 系统设置</a>
    </div>
    <div class="main-tabs-status" x-data="{}">
      <span class="status-pill" :class="comfyStatusClass" :title="comfyStatusTitle">
        <span class="status-dot"></span>
        <span class="status-text" x-text="comfyStatusShort"></span>
      </span>
      <a class="status-open" :href="comfyStatusUrl || '#'" target="_blank" rel="noopener"
         :class="{ disabled: !comfyStatusUrl }" title="在 ComfyUI 里打开">↗</a>
      <button class="status-refresh" type="button" @click="refreshStatus()" title="刷新状态">🔄</button>
    </div>
  </nav>

  <!-- 主内容区 (子模板填充) -->
  <main class="main-stage">
    <div class="page-frame">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
